name: First workflow
on: 
  push:
  pull_request:
    branches:
      - main


jobs:
    First-workflow:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: setup node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
        - name: install dependency
          run: npm ci

        - name: lint
          run : npm run lint

        - name: test
          run: npm run test
        - name: build
          run: npm run build
        - name: Upload build artifact
          uses: actions/upload-artifact@v4
          with:
            name: react-build
            path: dist/

        - name: " install vercel"
          run: npm install --globalvercel

        - name: deploy
          run: vercel --prod --yes --token="{{secrets.TOKEN}}"