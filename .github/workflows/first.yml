name: First workflow
on: push

jobs:
    First-workflow:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: setup node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
        - name: install dependency
          run: npm ci
        - name: build
          run: npm run build